<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinSphere AI — Risk Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0F1A;
    --panel: #10182B;
    --panel-2: #141F38;
    --line: #22304F;
    --text: #E7ECF6;
    --muted: #7C8AAE;
    --safe: #2DD4BF;
    --warn: #F5A623;
    --danger: #EF4A6D;
    --accent: #5B8CFF;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(91,140,255,0.10), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(45,212,191,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }
  .display{ font-family:'Space Grotesk', sans-serif; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 32px; border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(135deg, var(--accent), var(--safe));
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk'; font-weight:700; font-size:16px; color:#04101F;
  }
  .brand-title{ font-family:'Space Grotesk'; font-weight:700; font-size:19px; letter-spacing:0.2px; }
  .brand-sub{ color:var(--muted); font-size:12px; margin-top:1px; }

  .status-group{ display:flex; gap:10px; align-items:center; }
  .api-input{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    font-family:'JetBrains Mono'; font-size:12px; padding:8px 12px; border-radius:8px;
    width:280px; outline:none;
  }
  .api-input:focus{ border-color:var(--accent); }
  .pulse-dot{
    width:9px; height:9px; border-radius:50%; background:var(--muted);
    position:relative; flex-shrink:0;
  }
  .pulse-dot.live{ background:var(--safe); box-shadow:0 0 0 0 rgba(45,212,191,0.6); animation:pulse 1.8s infinite; }
  .pulse-dot.down{ background:var(--danger); }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(45,212,191,0.55); }
    70%{ box-shadow:0 0 0 8px rgba(45,212,191,0); }
    100%{ box-shadow:0 0 0 0 rgba(45,212,191,0); }
  }
  .status-text{ font-size:11px; color:var(--muted); font-family:'JetBrains Mono'; }
  .btn-connect{
    background:transparent; border:1px solid var(--line); color:var(--text);
    padding:8px 14px; border-radius:8px; font-size:12px; cursor:pointer; font-family:'Inter';
    transition:border-color .15s;
  }
  .btn-connect:hover{ border-color:var(--accent); }

  .tabs{ display:flex; gap:6px; padding:20px 32px 0; }
  .tab{
    padding:10px 18px; border-radius:9px 9px 0 0; cursor:pointer;
    font-family:'Space Grotesk'; font-weight:600; font-size:14px; color:var(--muted);
    border:1px solid transparent; border-bottom:none;
  }
  .tab.active{ color:var(--text); background:var(--panel); border-color:var(--line); }

  main{ padding:0 32px 40px; }
  .console{
    background:var(--panel); border:1px solid var(--line); border-radius:0 12px 12px 12px;
    padding:28px; display:grid; grid-template-columns:1fr 360px; gap:28px;
  }
  @media (max-width:900px){ .console{ grid-template-columns:1fr; } }

  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field.full{ grid-column:1 / -1; }
  .field label{ font-size:11px; color:var(--muted); font-family:'JetBrains Mono'; text-transform:uppercase; letter-spacing:0.04em; }
  .field input, .field select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:8px; font-size:14px; font-family:'Inter'; outline:none;
  }
  .field input:focus, .field select:focus{ border-color:var(--accent); }

  .run-btn{
    margin-top:20px; width:100%; padding:13px; border-radius:9px; border:none; cursor:pointer;
    background:var(--accent); color:#04101F; font-family:'Space Grotesk'; font-weight:700; font-size:14px;
    transition:filter .15s, transform .05s;
  }
  .run-btn:hover{ filter:brightness(1.08); }
  .run-btn:active{ transform:scale(0.99); }
  .run-btn:disabled{ opacity:0.5; cursor:not-allowed; }

  /* Result panel */
  .result-panel{ display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:16px; }
  .gauge-wrap{ position:relative; width:220px; height:220px; }
  .gauge-label{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .gauge-pct{ font-family:'Space Grotesk'; font-weight:700; font-size:34px; }
  .gauge-caption{ font-size:11px; color:var(--muted); font-family:'JetBrains Mono'; text-transform:uppercase; letter-spacing:0.05em; margin-top:2px; }

  .verdict{
    width:100%; text-align:center; padding:10px; border-radius:8px; font-family:'Space Grotesk'; font-weight:700; font-size:14px;
    letter-spacing:0.03em; text-transform:uppercase;
  }
  .verdict.safe{ background:rgba(45,212,191,0.12); color:var(--safe); border:1px solid rgba(45,212,191,0.35); }
  .verdict.danger{ background:rgba(239,74,109,0.12); color:var(--danger); border:1px solid rgba(239,74,109,0.35); }
  .verdict.idle{ background:transparent; color:var(--muted); border:1px dashed var(--line); }

  .readout{ width:100%; display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .readout-row{ display:flex; justify-content:space-between; font-size:12px; font-family:'JetBrains Mono'; color:var(--muted); border-top:1px solid var(--line); padding-top:8px; }
  .readout-row span:last-child{ color:var(--text); }

  .error-box{
    background:rgba(239,74,109,0.08); border:1px solid rgba(239,74,109,0.35); color:var(--danger);
    padding:10px 12px; border-radius:8px; font-size:12px; font-family:'JetBrains Mono'; margin-top:8px; display:none;
  }

  footer{ text-align:center; padding:18px; color:var(--muted); font-size:11px; font-family:'JetBrains Mono'; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">FS</div>
    <div>
      <div class="brand-title">FinSphere AI</div>
      <div class="brand-sub">Real-Time Risk &amp; Fraud Console</div>
    </div>
  </div>
  <div class="status-group">
    <input id="apiBase" class="api-input mono" placeholder="https://your-api-url.trycloudflare.com" />
    <button class="btn-connect" onclick="checkHealth()">Connect</button>
    <div class="pulse-dot" id="statusDot"></div>
    <div class="status-text" id="statusText">not connected</div>
  </div>
</header>

<div class="tabs">
  <div class="tab active" id="tabFraud" onclick="switchTab('fraud')">Fraud Detection</div>
  <div class="tab" id="tabRisk" onclick="switchTab('risk')">Credit Risk</div>
</div>

<main>
  <!-- FRAUD PANEL -->
  <div class="console" id="panelFraud">
    <div>
      <div class="field-grid">
        <div class="field"><label>Merchant</label><input id="f_merchant" value="fraud_Kirlin and Sons"></div>
        <div class="field"><label>Category</label>
          <select id="f_category">
            <option>shopping_net</option><option>grocery_pos</option><option>misc_net</option>
            <option>gas_transport</option><option>travel</option><option>entertainment</option>
            <option>food_dining</option><option>personal_care</option><option>home</option><option>health_fitness</option>
          </select>
        </div>
        <div class="field"><label>Amount ($)</label><input id="f_amt" type="number" value="249.99"></div>
        <div class="field"><label>Gender</label>
          <select id="f_gender"><option value="M">M</option><option value="F">F</option></select>
        </div>
        <div class="field"><label>Customer Lat</label><input id="f_lat" type="number" step="0.0001" value="33.9659"></div>
        <div class="field"><label>Customer Long</label><input id="f_long" type="number" step="0.0001" value="-80.9355"></div>
        <div class="field"><label>Merchant Lat</label><input id="f_mlat" type="number" step="0.0001" value="33.98"></div>
        <div class="field"><label>Merchant Long</label><input id="f_mlong" type="number" step="0.0001" value="-81.20"></div>
        <div class="field"><label>City Population</label><input id="f_citypop" type="number" value="333497"></div>
        <div class="field"><label>Transaction Time</label><input id="f_time" type="datetime-local" value="2026-07-24T02:35"></div>
        <div class="field full"><label>Date of Birth</label><input id="f_dob" type="date" value="1985-03-19"></div>
      </div>
      <button class="run-btn" id="runFraud" onclick="runFraud()">Score Transaction</button>
      <div class="error-box" id="fraudError"></div>
    </div>

    <div class="result-panel">
      <div class="gauge-wrap">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="92" fill="none" stroke="#1B2540" stroke-width="14"/>
          <circle id="fraudArc" cx="110" cy="110" r="92" fill="none" stroke="#2DD4BF" stroke-width="14"
                  stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="578"
                  transform="rotate(-90 110 110)" style="transition: stroke-dashoffset 0.7s ease, stroke 0.4s ease;"/>
        </svg>
        <div class="gauge-label">
          <div class="gauge-pct mono" id="fraudPct">—</div>
          <div class="gauge-caption">fraud probability</div>
        </div>
      </div>
      <div class="verdict idle" id="fraudVerdict">awaiting input</div>
      <div class="readout" id="fraudReadout"></div>
    </div>
  </div>

  <!-- RISK PANEL -->
  <div class="console" id="panelRisk" style="display:none;">
    <div>
      <div class="field-grid">
        <div class="field"><label>Credit Utilization</label><input id="r_util" type="number" step="0.01" value="0.85"></div>
        <div class="field"><label>Age</label><input id="r_age" type="number" value="45"></div>
        <div class="field"><label>Late 30–59 Days</label><input id="r_late3059" type="number" value="2"></div>
        <div class="field"><label>Debt Ratio</label><input id="r_debt" type="number" step="0.01" value="0.90"></div>
        <div class="field"><label>Monthly Income ($)</label><input id="r_income" type="number" value="3000"></div>
        <div class="field"><label>Open Credit Lines</label><input id="r_lines" type="number" value="6"></div>
        <div class="field"><label>Late 90+ Days</label><input id="r_late90" type="number" value="1"></div>
        <div class="field"><label>Real Estate Loans</label><input id="r_realestate" type="number" value="1"></div>
        <div class="field"><label>Late 60–89 Days</label><input id="r_late6089" type="number" value="0"></div>
        <div class="field"><label>Dependents</label><input id="r_dependents" type="number" value="2"></div>
      </div>
      <button class="run-btn" id="runRisk" onclick="runRisk()">Score Borrower</button>
      <div class="error-box" id="riskError"></div>
    </div>

    <div class="result-panel">
      <div class="gauge-wrap">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="92" fill="none" stroke="#1B2540" stroke-width="14"/>
          <circle id="riskArc" cx="110" cy="110" r="92" fill="none" stroke="#2DD4BF" stroke-width="14"
                  stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="578"
                  transform="rotate(-90 110 110)" style="transition: stroke-dashoffset 0.7s ease, stroke 0.4s ease;"/>
        </svg>
        <div class="gauge-label">
          <div class="gauge-pct mono" id="riskPct">—</div>
          <div class="gauge-caption">delinquency probability</div>
        </div>
      </div>
      <div class="verdict idle" id="riskVerdict">awaiting input</div>
      <div class="readout" id="riskReadout"></div>
    </div>
  </div>
</main>

<footer>FinSphere AI &middot; Predictive Financial Intelligence Platform &middot; Random Forest models served in real time</footer>

<script>
  const CIRC = 578; // 2 * PI * 92

  function switchTab(tab){
    document.getElementById('tabFraud').classList.toggle('active', tab==='fraud');
    document.getElementById('tabRisk').classList.toggle('active', tab==='risk');
    document.getElementById('panelFraud').style.display = tab==='fraud' ? 'grid' : 'none';
    document.getElementById('panelRisk').style.display = tab==='risk' ? 'grid' : 'none';
  }

  function getBase(){
    let v = document.getElementById('apiBase').value.trim();
    if(!v){ v = window.location.origin; }
    return v.replace(/\/$/, '');
  }

  async function checkHealth(){
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    try{
      const res = await fetch(getBase() + '/health');
      const data = await res.json();
      if(data.status === 'ok'){
        dot.className = 'pulse-dot live';
        text.textContent = `connected · fraud:${data.fraud_model_loaded} risk:${data.risk_model_loaded}`;
      } else {
        dot.className = 'pulse-dot down'; text.textContent = 'unexpected response';
      }
    } catch(e){
      dot.className = 'pulse-dot down';
      text.textContent = 'connection failed';
    }
  }

  function paintGauge(arcId, pctId, verdictId, prob, isPositive, positiveLabel, negativeLabel){
    const arc = document.getElementById(arcId);
    const pct = document.getElementById(pctId);
    const verdict = document.getElementById(verdictId);
    const offset = CIRC - (prob * CIRC);
    let color = '#2DD4BF';
    if(prob >= 0.66) color = '#EF4A6D';
    else if(prob >= 0.33) color = '#F5A623';
    arc.style.stroke = color;
    arc.style.strokeDashoffset = offset;
    pct.textContent = (prob*100).toFixed(1) + '%';
    verdict.className = 'verdict ' + (isPositive ? 'danger' : 'safe');
    verdict.textContent = isPositive ? positiveLabel : negativeLabel;
  }

  async function runFraud(){
    const btn = document.getElementById('runFraud');
    const errBox = document.getElementById('fraudError');
    errBox.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Scoring…';

    const payload = {
      merchant: document.getElementById('f_merchant').value,
      category: document.getElementById('f_category').value,
      amt: parseFloat(document.getElementById('f_amt').value),
      gender: document.getElementById('f_gender').value,
      lat: parseFloat(document.getElementById('f_lat').value),
      long: parseFloat(document.getElementById('f_long').value),
      city_pop: parseInt(document.getElementById('f_citypop').value),
      merch_lat: parseFloat(document.getElementById('f_mlat').value),
      merch_long: parseFloat(document.getElementById('f_mlong').value),
      trans_date_trans_time: document.getElementById('f_time').value.replace('T',' ') + ':00',
      dob: document.getElementById('f_dob').value
    };

    try{
      const res = await fetch(getBase() + '/predict/fraud', {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
      });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      paintGauge('fraudArc','fraudPct','fraudVerdict', data.fraud_probability, data.is_fraud, 'flagged as fraud', 'looks legitimate');
      document.getElementById('fraudReadout').innerHTML = `
        <div class="readout-row"><span>is_fraud</span><span>${data.is_fraud}</span></div>
        <div class="readout-row"><span>threshold_used</span><span>${data.threshold_used}</span></div>`;
    } catch(e){
      errBox.textContent = 'Could not reach the API: ' + e.message + '. Check the URL above and that the server is running.';
      errBox.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'Score Transaction';
    }
  }

  async function runRisk(){
    const btn = document.getElementById('runRisk');
    const errBox = document.getElementById('riskError');
    errBox.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Scoring…';

    const payload = {
      "RevolvingUtilizationOfUnsecuredLines": parseFloat(document.getElementById('r_util').value),
      "age": parseInt(document.getElementById('r_age').value),
      "NumberOfTime30-59DaysPastDueNotWorse": parseInt(document.getElementById('r_late3059').value),
      "DebtRatio": parseFloat(document.getElementById('r_debt').value),
      "MonthlyIncome": parseFloat(document.getElementById('r_income').value),
      "NumberOfOpenCreditLinesAndLoans": parseInt(document.getElementById('r_lines').value),
      "NumberOfTimes90DaysLate": parseInt(document.getElementById('r_late90').value),
      "NumberRealEstateLoansOrLines": parseInt(document.getElementById('r_realestate').value),
      "NumberOfTime60-89DaysPastDueNotWorse": parseInt(document.getElementById('r_late6089').value),
      "NumberOfDependents": parseInt(document.getElementById('r_dependents').value)
    };

    try{
      const res = await fetch(getBase() + '/predict/risk', {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
      });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      paintGauge('riskArc','riskPct','riskVerdict', data.delinquency_probability, data.high_risk, 'high risk borrower', 'low risk borrower');
      document.getElementById('riskReadout').innerHTML = `
        <div class="readout-row"><span>high_risk</span><span>${data.high_risk}</span></div>
        <div class="readout-row"><span>threshold_used</span><span>${data.threshold_used}</span></div>`;
    } catch(e){
      errBox.textContent = 'Could not reach the API: ' + e.message + '. Check the URL above and that the server is running.';
      errBox.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'Score Borrower';
    }
  }

  // if this page is served by the API itself, default the field to same-origin and connect immediately
  window.addEventListener('DOMContentLoaded', () => {
    checkHealth();
  });
</script>
</body>
</html>
